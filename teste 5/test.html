<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function inverterString() {
            // Defina a string de entrada (previamente definida no código)
            const input = 'Exemplo';
            
            let resultado = '';
            
            // Loop para inverter a string
            for (let i = input.length - 1; i >= 0; i--) {
            resultado += input[i];
            }

            // Exibe o resultado no alerta
            alert("Resultado: " + resultado);
        }

        // Chama a função para inverter a string
        inverterString();
    </script>
</body>

</html>
