<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Dados de faturamento no formato JSON
        const faturamentoData = {
          "faturamento_diario": [
            {"dia": 1, "faturamento": 1500},
            {"dia": 2, "faturamento": 0},
            {"dia": 3, "faturamento": 2000},
            {"dia": 4, "faturamento": 1800},
            {"dia": 5, "faturamento": 0},
            {"dia": 6, "faturamento": 2100},
            {"dia": 7, "faturamento": 0},
            {"dia": 8, "faturamento": 1700},
            {"dia": 9, "faturamento": 1600},
            {"dia": 10, "faturamento": 0},
            {"dia": 11, "faturamento": 1900},
            {"dia": 12, "faturamento": 2000},
            {"dia": 13, "faturamento": 2200},
            {"dia": 14, "faturamento": 0},
            {"dia": 15, "faturamento": 2500},
            {"dia": 16, "faturamento": 0},
            {"dia": 17, "faturamento": 2300},
            {"dia": 18, "faturamento": 2400},
            {"dia": 19, "faturamento": 0},
            {"dia": 20, "faturamento": 2600},
            {"dia": 21, "faturamento": 0},
            {"dia": 22, "faturamento": 2700},
            {"dia": 23, "faturamento": 2800},
            {"dia": 24, "faturamento": 0},
            {"dia": 25, "faturamento": 2900},
            {"dia": 26, "faturamento": 3000},
            {"dia": 27, "faturamento": 0},
            {"dia": 28, "faturamento": 3100},
            {"dia": 29, "faturamento": 3200},
            {"dia": 30, "faturamento": 0}
          ]
        };
    
        // Função para calcular o menor e maior faturamento e os dias com faturamento superior à média
        function relatorioFaturamento(faturamentoData) {
          const faturamentos = faturamentoData.faturamento_diario;
          
          let menorFaturamento = Infinity;
          let maiorFaturamento = -Infinity;
          let somaFaturamento = 0;
          let diasComFaturamento = 0;
          
          // Encontrando o menor e maior faturamento e calculando a soma para a média
          faturamentos.forEach(item => {
            if (item.faturamento > 0) {
              somaFaturamento += item.faturamento;
              diasComFaturamento++;
            }
            if (item.faturamento < menorFaturamento && item.faturamento > 0) {
              menorFaturamento = item.faturamento;
            }
            if (item.faturamento > maiorFaturamento) {
              maiorFaturamento = item.faturamento;
            }
          });
    
          // Calculando a média mensal
          const mediaFaturamento = somaFaturamento / diasComFaturamento;
    
          // Contando os dias com faturamento superior à média
          let diasAcimaMedia = 0;
          faturamentos.forEach(item => {
            if (item.faturamento > mediaFaturamento) {
              diasAcimaMedia++;
            }
          });
    
          // Exibindo os resultados
          alert(`Menor Faturamento: R$ ${menorFaturamento}`);
          alert(`Maior Faturamento: R$ ${maiorFaturamento}`);
          alert(`Média de Faturamento: R$ ${mediaFaturamento.toFixed(2)}`);
          alert(`Número de dias com faturamento superior à média: ${diasAcimaMedia}`);
        }
    
        // Chama a função com os dados de faturamento
        relatorioFaturamento(faturamentoData);
      </script>
</body>

</html>
