<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <script>
    // Faturamento por estado (em R$)
    const faturamentoPorEstado = {
      "SP": 67836.43,
      "RJ": 36678.66,
      "MG": 29229.88,
      "ES": 27165.48,
      "Outros": 19849.53
    };

    // Função para calcular os percentuais
    function calcularPercentuais(faturamento) {
      // Calculando o total de faturamento
      const totalFaturamento = Object.values(faturamento).reduce((acc, valor) => acc + valor, 0);

      // Exibindo os percentuais
      for (let estado in faturamento) {
        const percentual = (faturamento[estado] / totalFaturamento) * 100;
        alert(`${estado}: R$ ${faturamento[estado].toFixed(2)} - ${percentual.toFixed(2)}%`);
      }
    }

    // Chama a função para calcular os percentuais
    calcularPercentuais(faturamentoPorEstado);
  </script>

</body>

</html>
